name: Gashapon Stock Checker

on:
  schedule:
    - cron: '*/5 * * * *' # 代表每 5 分鐘執行一次
  workflow_dispatch: # 允許你手動按鈕觸發測試

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python checker.py
